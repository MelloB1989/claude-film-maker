# The finals: 1920x1080 16:9 PNG (+ the sequence's WAV), 8 temporal samples (motion blur from the cameras),
# 32 warm-up frames per shot, film-quality cvars, one MRQ job per shot from the shot's first frame. Resumes: frames
# already on disk are skipped, so a re-run after a crash or a cancel renders only what is missing.
#   set shots, no presenters (start now):  film-ue apply .../30-final.yaml
#   presenter shots as each is approved:   film-ue apply .../30-final.yaml --set batch=S13 --set 'shots=["Reel_S13"]'
#   a shot that CHANGED after its final:   ... --set batch=S16b --set 'shots=["Reel_S16"]' --set overwrite=true
# AA: calibration C (no AA, 4 spatial x 8 temporal): TSR (A) erased the 1.6 cm under-shelf LED strips; C keeps them
# with smoother edges than B (2x8). Shutter opens at the frame: a centred shutter blended the previous shot's camera
# into each shot's first frame (S11 f720, S12 f780 of the TSR finals). Frames go to final_c: the TSR set finals in
# final/ are superseded (resume would otherwise keep them).
kind: include
files: [vars.yaml]
---
kind: vars
vars:
  batch: set
  # V04 waits for agent-09's fix of the sun-to-zero brightness step at f530: then --set batch=V04 --set 'shots=["Reel_V04"]'
  shots: [Reel_V01, Reel_V02, Reel_V03, Reel_V05, Reel_S11, Reel_S12, Reel_N01]
  overwrite: false
  final: final_c   # the folder under ${out}: a fresh one per take (--set final=final_d), since overwrite never converges
  aa: none
  spatial: 4
---
kind: render
version: 1
name: "r3_final_${batch}"
sequence: "${seq}"
level: "${level}"
out_dir: "${out}/${final}"
preset: final
shots: ${shots}
chunking: shot
preroll: cut
aa_method: "${aa}"
spatial: ${spatial}
shutter_timing: open
overwrite: ${overwrite}
# hair: groom.lock's render_cvars (round 5, docs/unreal/research/hair-lod.md): no Auto-LOD curve thinning on wide
# shots (S18's short hair in round 4), no cards. Run `film-ue op groom.lock labels=[Host, Presenter]` BEFORE this.
cvars: {"r.SSS.Quality": 1, "r.SSS.HalfRes": 0, "r.HairStrands.LODMode": 0, "r.HairStrands.AutoLOD.Bias": 1.0,
        "r.HairStrands.UseCardsInsteadOfStrands": 0}
