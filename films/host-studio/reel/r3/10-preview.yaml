# Whole reel, fast (960x540, 1 sample, JPG, seconds per shot): after every rebuild of SEQ_Reel, before any final.
# agent-09 reviews it (framing, clipping, the hair pop, the watch); agent-06 can rough the cut from it.
kind: include
files: [vars.yaml]
---
kind: vars
vars:
  # all 13 by default; after a re-place, only the presenters':
  #   film-ue apply .../10-preview.yaml --set 'shots=["Reel_S13","Reel_S15","Reel_S16","Reel_S17","Reel_S18"]'
  shots: [Reel_V01, Reel_V02, Reel_V03, Reel_V04, Reel_V05, Reel_S11, Reel_S12, Reel_N01, Reel_S13, Reel_S15, Reel_S16, Reel_S17, Reel_S18]
---
kind: render
version: 1
name: r3_preview
sequence: "${seq}"
level: "${level}"
out_dir: "${out}/preview"
preset: preview
shots: ${shots}
chunking: shot           # one MRQ job per camera cut, each from its own first frame (cloth pre-roll rule)
overwrite: true          # the scene changes between rebuilds: never keep a stale preview frame
