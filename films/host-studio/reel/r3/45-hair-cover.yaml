# Gate c (agent-09): her hair's green ends are the olive overshirt showing through the thin tips. S16 f1240-1243 at
# the finals' quality, one render per strand coverage variant, driven by reel/hair_cover_ab.py (which sets the groom
# and puts it back):  film-ue apply .../45-hair-cover.yaml --set tag=<variant>
# Pre-rolled from S16's first frame (preroll: cut) so the hair arrives as in the full shot. AA as the finals: 30-final.yaml's
# calibration C (no AA, 4 spatial, shutter open); TSR smears sub-pixel strand tips, so a TSR A/B would not say how the
# tips cover in the finals.
kind: include
files: [vars.yaml]
---
kind: vars
vars:
  tag: base
  run: manual   # hair_cover_ab.py passes a fresh one: a new directory renders afresh, a repeat converges
---
kind: render
version: 1
name: "r3_hair_cover_${tag}"
sequence: "${seq}"
level: "${level}"
out_dir: "${out}/hair_cover/${run}/${tag}"
preset: final
shots: [Reel_S16]
frames: [1240, 1244]
chunking: shot
preroll: cut
aa_method: none
spatial: 4
shutter_timing: open
cvars: {"r.SSS.Quality": 1, "r.SSS.HalfRes": 0}
