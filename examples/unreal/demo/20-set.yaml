# Stage 2 (WP6 + generic): the level, and the set as one scene spec: a floor, two walls, a desk, a stool, the host.
kind: include
files: [vars.yaml]
---
kind: level
version: 1
name: demo-level
path: "${level}"
---
kind: scene
version: 1
name: demo-set
folder: Demo
actors:
  - {label: Floor, shape: plane, size: [1200, 1200, 100], loc: [0, 0, 0]}
  - {label: WallBack, shape: cube, size: [20, 1200, 400], loc: [-400, 0, 200]}
  - {label: WallSide, shape: cube, size: [1200, 20, 400], loc: [0, -500, 200]}
  - {label: Desk, shape: cube, size: [80, 160, 75], loc: [-120, 0, 37.5], drop: true}
  - {label: Stool, shape: cylinder, size: [40, 40, 60], relative: {of: Desk, offset_cm: [0, -130, 0], face: toward}, drop: true}
  - {label: "${host}", asset: "${host_bp}", loc: [0, 0, 0], rot: {yaw: 0}, tags: [hero]}
