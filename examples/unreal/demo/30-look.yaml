# Stage 3 (WP5): the light. Three rect lights (key, fill, rim) on the host, a bit of haze, exposure fixed for the
# render. look.light converges on its label (respawned with the same settings), so these re-run safely.
kind: include
files: [vars.yaml]
---
kind: op
version: 1
order: 40
name: light-key
op: look.light
args: {label: Key, kind: rect, loc: [260, 170, 230], look_at: [0, 0, 160], intensity: 18, temperature: 5200, width: 120, height: 120}
---
kind: op
version: 1
order: 40
name: light-fill
op: look.light
args: {label: Fill, kind: rect, loc: [260, -220, 160], look_at: [0, 0, 150], intensity: 5, temperature: 5600, width: 200, height: 200, shadows: false}
---
kind: op
version: 1
order: 40
name: light-rim
op: look.light
args: {label: Rim, kind: rect, loc: [-260, 120, 260], look_at: [0, 0, 165], intensity: 14, temperature: 4300}
---
kind: op
version: 1
order: 40
name: haze
op: look.fog
args: {density: 0.01, volumetric: true}
---
kind: op
version: 1
order: 40
name: exposure
op: look.post
args: {settings: {auto_exposure_method: AutoExposureMethod.AEM_MANUAL, auto_exposure_bias: 10.0}, label: Demo_Post}
---
# hair strands take the sky light unoccluded: indoors the hair and beard read orange-white (unreal/README.md trap;
# day 1's close-up showed it)
kind: op
version: 1
order: 40
name: hair-sky-lighting
op: editor.cvar
args: {name: r.HairStrands.SkyLighting, value: "0"}
