# A wide on a rail, dollying along the set: drive it with cam.rig_move (position 0 -> 1).
kind: camera
version: 1
name: CAM_Rail_Wide
loc: [600, -300, 150]
look_at: [0, 0, 120]
focal_mm: 24
aperture: 5.6
rig: {kind: rail, points: [[600, -300, 150], [600, 300, 150]], position: 0}
