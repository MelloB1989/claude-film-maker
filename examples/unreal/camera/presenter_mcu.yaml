# A medium close-up of the presenter from her 3/4 left at eye level on a 50 mm, focus tracking her eyes.
kind: camera
version: 1
name: CAM_Presenter_MCU
frame: {subjects: [Presenter], size: MCU, angle: 3/4, side: left, height: eye, focal_mm: 50}
aperture: 2.8
focus: {mode: track, target: "eyes:Presenter"}
