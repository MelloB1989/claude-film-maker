[project]
name = "film-tools"
version = "0.1.0"
description = "Audio, timing and delivery tools for films made with the film engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "fonttools>=4.53",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# the anime pipeline's local image work (filmtools.anime): character cutouts (ONNX) and depth maps (CPU or Apple MPS)
anime = [
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18",
  "torch>=2.4",
  "transformers>=4.44",
]

[project.scripts]
film-vo = "filmtools.vo:main"
film-realign = "filmtools.realign:main"
film-pace = "filmtools.pace:main"
film-audition = "filmtools.audition:main"
film-edit = "filmtools.edit:main"
film-music = "filmtools.music:main"
film-beats = "filmtools.beats:main"
film-splice = "filmtools.splice:main"
film-snap = "filmtools.snap:main"
film-mix = "filmtools.mix:main"
film-fonts = "filmtools.fonts:main"
film-sync = "filmtools.sync:main"
film-facts = "filmtools.factcheck:main"
film-vo-chain = "filmtools.vochain:main"
film-sfx-lib = "filmtools.sfxlib:main"
film-sfx = "filmtools.sfx:main"
film-deliver = "filmtools.deliver:main"
film-temptrack = "filmtools.temptrack:main"
film-init = "filmtools.init:main"
film-anime-fetch = "filmtools.anime.assets:main"
film-anime-cutout = "filmtools.anime.cutout:main"
film-anime-depth = "filmtools.anime.depth:main"
film-anime-dialogue = "filmtools.anime.dialogue:main"
film-anime-clips = "filmtools.anime.clips:main"
film-anime-score = "filmtools.anime.score:main"
film-anime-mix = "filmtools.anime.mix:main"
film-anime-render = "filmtools.anime.render:main"
film-anime-review = "filmtools.anime.review:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filmtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
