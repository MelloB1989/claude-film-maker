<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b080a; color: #ede7ea; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 84px 0; display: flex; align-items: center; justify-content: center; }
  #c { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  #stage { position: relative; max-width: 100%; max-height: 100%; display: flex; }
  #safe { position: absolute; inset: 0; pointer-events: none; display: none; }
  #safe.on { display: block; }
  #safe div { position: absolute; border: 1px dashed #ffffff55; }
  #top { display: flex; gap: 12px; align-items: center; color: #a99fa5; }
  #top select { background: #151214; color: #ede7ea; border: 1px solid #333; font: inherit; }
  #keys { margin-left: auto; color: #6f6469; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 12px; box-sizing: border-box; background: #0b0b0c; }
  #ui.hidden { display: none; } #ui.hidden ~ #wrap { bottom: 0; }
  #scrub { width: 100%; margin: 0; accent-color: #c22b45; }
  #marks { position: relative; height: 16px; }
  .mark { position: absolute; top: 0; height: 14px; border-left: 1px solid #c22b45; color: #a99fa5; font-size: 9px; overflow: hidden; white-space: nowrap; padding-left: 2px; cursor: pointer; box-sizing: border-box; }
  .mark:hover { color: #ede7ea; background: #c22b4522; }
  #info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #a99fa5; }
  #errs { display: none; position: fixed; top: 8px; left: 8px; right: 8px; max-height: 40vh; overflow: auto; background: #300; color: #fbb; padding: 8px; white-space: pre-wrap; z-index: 9; }
  body.export #ui, body.export #errs { display: none !important; }
  body.export #wrap { inset: 0; }
  body.export #c { max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas><div id="safe"><div id="action"></div><div id="title"></div></div></div></div>
<div id="ui">
  <div id="top"><select id="films" title="film"></select><span id="fmt"></span><span id="keys">space play · ←/→ ±1s · ,/. frame · [/] shot · l loop · g safe areas · p png · h hide</span></div>
  <div id="marks"></div>
  <input id="scrub" type="range" min="0" value="0" />
  <div id="info"></div>
</div>
<pre id="errs"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
